<s5-part name="site-header"></s5-part>
<main class="s5-template" data-s5-template="single">
  <article class="post">
    <header class="post-header">
      <p class="eyebrow"><s5-field name="date"></s5-field> · <s5-field name="author"></s5-field></p>
      <h1 class="page-hero_title"><s5-field name="title"></s5-field></h1>
    </header>
    <div class="post-media"><s5-field name="featured-image"></s5-field></div>
    <div class="post-content"><s5-field name="content"></s5-field></div>
    <s5-comments></s5-comments>
  </article>
</main>
<s5-part name="site-footer"></s5-part>
